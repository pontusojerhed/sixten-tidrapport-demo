<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sixten Tidrapport – klickbar demo</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#182b43;background:#eef3f8}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.shell{max-width:1020px;margin:auto;padding:20px 14px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:11px;font-weight:850;letter-spacing:.07em}.logo{background:#15263e;color:#80d6ff;border-radius:14px;padding:13px;font-size:24px}.sub{font-size:11px;color:#6a7c90;letter-spacing:.14em}.pill{border:1px solid #d6e1ec;border-radius:30px;padding:6px 10px;color:#61758b;font-size:12px;background:white}.panel{background:#fff;border:1px solid #dbe5ee;border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 5px 24px #18334d08}.hero{background:#15263e;color:white;border:0}.hero .muted{color:#bfd1e5}.muted{color:#718198}.small{font-size:13px}.tiny{font-size:11px}.big{font-size:34px;font-weight:800;letter-spacing:-.04em}.heading{font-size:23px;font-weight:800;margin:0 0 8px}.h2{font-size:17px;font-weight:800;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{padding:17px;border:1px solid #dce6ef;border-radius:16px;background:#f7fafd;text-align:left;color:#182b43}.tile:hover{border-color:#63b9eb}.tile strong{display:block;margin:9px 0 5px}.btn{border:0;background:#2466a4;color:white;border-radius:12px;padding:12px 16px;font-weight:700}.btn:hover{filter:brightness(1.07)}.btn.alt{background:#edf3f8;color:#234463}.btn.outline{border:1px solid #c9d9e8;background:white;color:#234463}.btn.danger{background:#fff0f0;color:#a13232}.btn.wide{width:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.wrap{flex-wrap:wrap}.stack{display:grid;gap:12px}.field{display:grid;gap:6px}.field label{font-size:13px;font-weight:750}.input{width:100%;border:1px solid #cedce8;border-radius:11px;padding:11px;background:white;color:#182b43;min-width:0}.input:focus{outline:2px solid #9bd8ff}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}.tabs button{border:1px solid #d4e1ec;border-radius:10px;padding:9px 12px;background:white;color:#39556f}.tabs button.active{background:#15263e;color:white;border-color:#15263e}.radio{display:flex;gap:9px;align-items:center;padding:11px 12px;border:1px solid #dce6ef;border-radius:12px;background:#f8fbfd;cursor:pointer}.radio input{accent-color:#2466a4}.notice{padding:13px;border-radius:12px;background:#edf7ff;color:#315777;font-size:13px}.warn{background:#fff6e6;color:#805a19}.good{background:#ebf9f0;color:#246a42}.record{border:1px solid #dce6ef;border-radius:14px;padding:13px;margin:9px 0}.tag{font-size:11px;padding:5px 9px;border-radius:20px;background:#eaf0f7;color:#51687e;white-space:nowrap}.tag.ok{background:#e5f8eb;color:#247044}.tag.bad{background:#fff1d8;color:#805a19}.divider{border-top:1px solid #e1e9f0;margin:14px 0}.hide{display:none!important}.right{text-align:right}.back{border:0;background:transparent;color:#2466a4;font-weight:750;padding:4px 0 14px}.footer{color:#77889a;font-size:12px;text-align:center;margin-top:20px}.status{display:flex;align-items:center;gap:9px;padding:12px 0;border-bottom:1px solid #e4ebf1}.status:last-child{border:0}.dot{height:9px;width:9px;border-radius:50%;background:#5a9c77}.dangerText{color:#b34a4a}.num{font-variant-numeric:tabular-nums}.rolebar{display:flex;flex-wrap:wrap;gap:8px}.rolebar button{border:1px solid #d3e0ec;border-radius:12px;padding:10px 13px;background:#fff;color:#244765}.rolebar button.active{background:#15263e;color:#fff}.checkbox{display:flex;gap:12px;align-items:center;padding:13px;border:1px solid #dbe6ef;border-radius:12px}.checkbox input{width:19px;height:19px;accent-color:#2466a4}.locked{border:1px dashed #b7ccdd;border-radius:14px;padding:15px;background:#f6faff}.auth{max-width:470px;margin:20px auto}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:620px){.grid3{grid-template-columns:1fr}.two{grid-template-columns:1fr}.shell{padding:14px 10px 60px}.panel{padding:16px}.heading{font-size:21px}.big{font-size:30px}}@media(max-width:370px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="shell"><div class="top"><div class="brand"><div class="logo">🚛</div><div>SIXTEN<div class="sub">TIDRAPPORT</div></div></div><span class="pill">KLICKBAR DEMO · INGA RIKTIGA UPPGIFTER</span></div><div id="app"></div><div class="footer">Sixten Tidrapport · Prototyp för diskussion · Ingen riktig inloggning, e-post, databas eller Raspberry Pi-anslutning.</div></main><script>
'use strict';const today='2026-10-14';const base=[{id:1,user:'mig',date:'2026-10-12',type:'work',start:'05:00',end:'16:00',break:30,reg:'ABC',allow:true,note:'Lossning Örebro',approved:false},{id:2,user:'mig',date:'2026-10-13',type:'sick',approved:false},{id:3,user:'anna',date:'2026-10-12',type:'work',start:'06:00',end:'15:30',break:30,reg:'DEF',allow:false,note:'',approved:false},{id:4,user:'erik',date:'2026-10-12',type:'work',start:'04:00',end:'16:00',break:45,reg:'GHI',allow:true,note:'',approved:false}];const users=[{id:'mig',name:'Du (chaufför)',email:'du@demo.se'},{id:'anna',name:'Chaufför Anna',email:'anna@demo.se'},{id:'erik',name:'Chaufför Erik',email:'erik@demo.se'}];const labels={work:'🚛 Arbetat',free:'🏡 Ledig',sick:'🤒 Sjuk',vab:'👶 VAB',vacation:'☀️ Semester',other:'📋 Annan frånvaro'};const state={role:'driver',page:'login',extended:false,tab:'overview',filter:'all',month:'2026-10',date:today,type:'work',reg:'',start:'05:00',end:'16:30',break:30,allow:false,note:'',authEmail:'',name:'',email:'',showPass:false,records:load(),people:loadPeople(),logs:[],request:false,editId:null,dayView:'2026-10-12',periodLocks:{},audit:[]};function load(){try{return JSON.parse(localStorage.getItem('sixten_demo_v2_records'))||base}catch{return base}}function loadPeople(){try{return JSON.parse(localStorage.getItem('sixten_demo_v2_people'))||users}catch{return users}}function persist(){localStorage.setItem('sixten_demo_v2_records',JSON.stringify(state.records));localStorage.setItem('sixten_demo_v2_people',JSON.stringify(state.people))}const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const $=id=>document.getElementById(id);const hrs=r=>{if(r.type!=='work')return 0;const [h,m]=r.start.split(':').map(Number),[e,n]=r.end.split(':').map(Number);let v=e*60+n-h*60-m;if(v<0)v+=1440;return Math.max(0,v-Number(r.break||0))/60};const fmt=x=>x.toLocaleString('sv-SE',{maximumFractionDigits:2});const dateFmt=d=>new Date(d+'T12:00:00').toLocaleDateString('sv-SE',{day:'numeric',month:'long',year:'numeric'});const button=(label,action,cls='')=>`<button class="btn ${cls}" onclick="actions.${action}">${label}</button>`;const go=p=>{state.page=p;render()};const back=()=>`<button class="back" onclick="actions.go('home')">← Till startsidan</button>`;const box=(x,cls='')=>`<section class="panel ${cls}">${x}</section>`;const nav=()=>`<div class="tabs">${[['overview','Översikt'],['daily','Dagsöversikt'],['reports','Månadsrapporter'],['payroll','Löneunderlag'],['people','Chaufförer']].map(([k,v])=>`<button class="${state.tab===k?'active':''}" onclick="actions.tab('${k}')">${v}</button>`).join('')}</div>`;function own(){const rs=state.records.filter(r=>r.user==='mig'&&r.date.startsWith(state.month));return {rs,h:rs.reduce((a,r)=>a+hrs(r),0),t:rs.filter(r=>r.allow).length}}function adminAllowed(){return state.role==='boss'||state.extended}function locked(r){return !!state.periodLocks[r.user+'|'+r.date.slice(0,7)]}function logChange(r,old,actor){state.audit.unshift({date:new Date().toLocaleString('sv-SE'),user:r.user,day:r.date,actor,old,new:JSON.parse(JSON.stringify(r))})}function driverName(id){return state.people.find(p=>p.id===id)?.name||id}function render(){let h='';if(state.page==='login'){h=box(`<div class="heading">Välkommen tillbaka 👋</div><p class="muted">Testa olika roller. Allt här är låtsasdata.</p><div class="field"><label>Demoinloggning</label><div class="rolebar">${[['driver','🚛 Chaufför + systemägare'],['boss','👔 Chef']].map(([k,v])=>`<button class="${state.role===k?'active':''}" onclick="actions.role('${k}')">${v}</button>`).join('')}</div></div><div class="stack" style="margin-top:16px"><div class="field"><label>E-post</label><input class="input" type="email" value="${state.role==='boss'?'chef@demo.se':'du@demo.se'}" readonly></div><div class="field"><label>Lösenord</label><input class="input" type="password" value="demolosen" readonly></div>${button('Logga in i demon →','login()','wide')}<button class="btn alt wide" onclick="actions.go('forgot')">Glömt lösenord?</button></div><p class="small muted">Här krävs inget riktigt lösenord. Chefen och chauffören ser olika vyer.</p>`,'auth')}
else if(state.page==='forgot'){h=box(`<button class="back" onclick="actions.go('login')">← Till inloggning</button><h2>Återställ lösenord</h2><p class="muted">Skriv din mejladress. I riktiga appen skickas en säker engångslänk.</p><div class="field"><label>E-post</label><input class="input" id="resetmail" type="email" placeholder="namn@exempel.se"></div><br>${button('Skicka återställningslänk','reset()','wide')}<p class="small muted">Demon skickar inga mejl.</p>`,'auth')}
else if(state.page==='resetDone'){h=box(`<div style="text-align:center;font-size:40px">✉️</div><h2 style="text-align:center">Kolla mejlen!</h2><p class="muted">Om adressen finns registrerad skickas en återställningslänk. I demon skickas inget.</p>${button('Till inloggningen','go(\'login\')','wide')}`,'auth')}
else{const header=`<div class="row wrap" style="margin-bottom:14px"><div><div class="muted small">Inloggad som</div><strong>${state.role==='boss'?'👔 Chef':state.extended?'🔐 Systemägare · utökad åtkomst':'🔧 Chaufför · systemägare'}</strong></div><button class="btn alt" onclick="actions.logout()">Logga ut</button></div>`;if(state.page==='home'){const o=own();h=header+box(`<div class="muted small">Mina timmar · ${state.month}</div><div class="big">${fmt(o.h)} timmar</div><div class="muted">${o.t} traktamenten · egna testuppgifter</div>`,'hero')+`<div class="grid" style="margin-bottom:14px">${[['report','📝','Rapportera dag','Arbete, ledigt eller frånvaro'],['history','📅','Mina timmar','Historik och summering'],['system','🛠️','System & säkerhet','Endast för systemägaren'],['help','🤖','Fråga Sixten','Enkel hjälp med appen']].filter(x=>state.role!=='boss'||!['system'].includes(x[0])).map(([p,i,n,d])=>`<button class="tile" onclick="actions.go('${p}')"><span style="font-size:24px">${i}</span><strong>${n}</strong><span class="small muted">${d}</span></button>`).join('')}</div>`+(adminAllowed()?box(`<h2 class="h2">Personaladministration</h2><p class="muted small">Rapporter och löneunderlag visas bara med chefens inloggning eller efter extra verifiering.</p>${button('Öppna chefspanelen','go(\'admin\')','wide')}`):box(`<div class="row"><strong>🔒 Personaluppgifter skyddade</strong><span class="tag">Låst</span></div><p class="muted small">Du ser inte andra chaufförers timmar eller löneunderlag i ditt vanliga läge.</p>${button('Begär utökad åtkomst','go(\'unlock\')','wide outline')}`));}
else if(state.page==='unlock'){h=header+box(`${back()}<h2 class="heading">🔐 Utökad åtkomst</h2><p>För att se andra chaufförers timmar och löneunderlag krävs en extra verifiering.</p><div class="notice warn">I den färdiga appen: nytt lösenord eller tvåfaktorsverifiering, tidsbegränsad session och en skyddad åtkomstlogg. Här simuleras det.</div><div class="field" style="margin-top:14px"><label>Extra verifiering (demo)</label><input class="input" type="password" placeholder="Skriv vad som helst" id="secondpass"></div><br>${button('Verifiera och lås upp','unlock()','wide')}<p class="small muted">Chefen ser inte automatiskt dina åtkomstloggar. En särskild rapport kan lämnas på begäran.</p>`)}
else if(state.page==='report'){h=header+box(`${back()}<h2 class="heading">${state.editId?'Ändra min tidrapport':'Rapportera en dag'}</h2><div class="field"><label>Datum</label><input id="daydate" class="input" type="date" value="${esc(state.date)}" onchange="actions.field('date',this.value)"></div><div style="margin-top:14px" class="field"><label>Vad gäller för dagen?</label><div class="grid">${Object.entries(labels).map(([k,v])=>`<label class="radio"><input type="radio" name="daytype" ${state.type===k?'checked':''} onchange="actions.type('${k}')">${v}</label>`).join('')}</div></div><div id="workfields" class="stack" style="margin-top:15px;${state.type!=='work'?'display:none':''}"><div class="field"><label>Reg.nr – bara de tre första bokstäverna</label><input id="reg" class="input" style="max-width:110px;text-transform:uppercase;letter-spacing:3px;font-weight:800" maxlength="3" placeholder="ABC" value="${esc(state.reg)}" oninput="actions.reg(this)"><span class="muted tiny">Exempel: ABC. Inga siffror.</span></div><div class="two"><div class="field"><label>Starttid</label><input class="input" type="time" value="${state.start}" onchange="actions.field('start',this.value)"></div><div class="field"><label>Sluttid</label><input class="input" type="time" value="${state.end}" onchange="actions.field('end',this.value)"></div></div><div class="field"><label>Rast</label><select class="input" onchange="actions.field('break',this.value)">${[0,30,45,60].map(v=>`<option value="${v}" ${Number(state.break)===v?'selected':''}>${v} minuter</option>`).join('')}</select></div><label class="checkbox"><input type="checkbox" ${state.allow?'checked':''} onchange="actions.field('allow',this.checked)"><span><strong>Traktamente</strong><div class="muted small">Kryssa i om traktamente ska rapporteras</div></span></label><div class="field"><label>Kommentar (frivillig)</label><textarea class="input" rows="2" placeholder="Exempelvis lastning, lossning ..." oninput="actions.field('note',this.value)">${esc(state.note)}</textarea></div><div class="notice">Arbetad tid: <strong id="worked">${fmt(estimate())} timmar</strong></div></div><div class="notice" id="awayinfo" style="margin-top:15px;${state.type==='work'?'display:none':''}">Vid ledighet eller frånvaro behöver du inte fylla i tider, reg.nr eller traktamente.</div><br>${button(state.editId?'Spara ändringar':'Spara dagens rapport','save()','wide')} ${state.editId?button('Avbryt redigering','cancelEdit()','wide alt'):''}<p class="muted small">Alla dagar kan rapporteras. Vardagar kan markeras som saknade först när rapporteringstiden gått ut. Helger flaggas inte automatiskt.</p>`)}
else if(state.page==='saved'){h=header+box(`<div style="text-align:center;font-size:46px">✅</div><h2 class="heading" style="text-align:center">Rapporten är sparad!</h2><p class="muted">Du hittar den i Mina timmar. Endast lokalt i den här demowebbläsaren.</p>${button('Visa mina timmar','go(\'history\')','wide')}<br><br>${button('Rapportera en dag till','go(\'report\')','wide alt')}`)}
else if(state.page==='history'){const o=own();h=header+box(`${back()}<h2 class="heading">Mina timmar</h2><p class="muted small">Du kan redigera dina egna dagar tills chefen fastställt löneperioden.</p><div class="field"><label>Månad</label><input class="input" type="month" value="${state.month}" onchange="actions.month(this.value)"></div><div class="grid" style="margin-top:13px"><div class="tile"><div class="muted small">Arbetstid</div><div class="big">${fmt(o.h)} h</div></div><div class="tile"><div class="muted small">Traktamenten</div><div class="big">${o.t} st</div></div></div><h3>Rapporterade dagar</h3>${o.rs.length?o.rs.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>record(r,true)).join(''):'<p class="muted">Inga rapporter för den här månaden.</p>'}`)}
else if(state.page==='admin'){if(!adminAllowed()){go('unlock');return}h=header+box(`${back()}<h2 class="heading">Chefens administration</h2><div class="notice">${state.role==='boss'?'Chefens vanliga behörighet':'Du använder tillfällig utökad åtkomst. Aktiviteten loggas i en skyddad systemlogg.'}</div>${state.extended?`<br>${button('Avsluta utökad åtkomst','lock()','outline')}`:''}`)+nav()+adminContent()}
else if(state.page==='system'){if(state.role==='boss'){go('home');return}h=header+box(`${back()}<h2 class="heading">System & säkerhet</h2><p class="muted">Din tekniska panel. Inga andra chaufförers tider visas här.</p>${[['🖥️','Raspberry Pi / webbserver','Övervakning och fellarm'],['🗄️','Databas','Kontroller och återställning'],['☁️','Google Drive-backup','Säkerhetskopior och återställning'],['🛡️','Säkerhetslogg','Utökad åtkomst och ändringar']].map(([i,n,d])=>`<div class="status"><span style="font-size:22px">${i}</span><div style="flex:1"><strong>${n}</strong><div class="muted small">${d}</div></div><span class="tag">Planerat</span></div>`).join('')}<div class="notice warn" style="margin-top:12px">Inga verkliga serverdata visas. Chefen får vid begäran en särskild loggrapport, inte direkt tillgång till loggarna.</div>${state.audit.length?`<h3>Demologg över ändringar</h3>${state.audit.slice(0,12).map(a=>`<p class="small">${esc(a.date)} · ${esc(a.actor)} · ${esc(a.event||('Ändring '+a.day))}</p>`).join('')}`:''}${state.logs.length?`<h3>Åtkomstlogg</h3>${state.logs.map(l=>`<p class="small">${esc(l)}</p>`).join('')}`:''}`)}
else if(state.page==='help'){h=header+box(`${back()}<h2 class="heading">🤖 Fråga Sixten</h2><p class="muted">I den färdiga appen kan Sixten hjälpa till med frågor om hur rapporteringen fungerar. Här finns färdiga demosvar.</p><div class="stack">${[['Jag glömde rapportera igår','Öppna Rapportera dag, välj gårdagens datum och fyll i uppgifterna. Om perioden är låst kontaktar du chefen.'],['Jag var sjuk – måste jag fylla i tider?','Nej. Välj Sjuk som dagstyp och spara. Då räknas dagen som aktivt rapporterad.'],['Jag körde i söndags','Välj söndagens datum och Arbetat. Söndagar är inte automatiskt lediga eller schemalagda.'],['Jag har glömt lösenordet','Tryck på Glömt lösenord? på inloggningssidan. Då kan du begära en säker återställningslänk.']].map(([q,a])=>`<details class="record"><summary style="cursor:pointer;font-weight:700">${q}</summary><p class="small">${a}</p></details>`).join('')}</div><div class="notice">Ingen AI är ansluten till demon och ingen chatt skickas till Sixten.</div>`)}
} $('app').innerHTML=h}function estimate(){const [a,b]=[state.start,state.end].map(v=>{let [h,m]=v.split(':').map(Number);return h*60+m});let d=b-a;if(d<0)d+=1440;return Math.max(0,(d-Number(state.break))/60)}function record(r,editable=false){return `<div class="record"><div class="row"><strong>${esc(dateFmt(r.date))}</strong><span class="tag ${r.type==='work'?'ok':''}">${labels[r.type]||r.type}</span></div>${r.type==='work'?`<p class="small">${esc(r.start)}–${esc(r.end)} · Rast ${r.break} min · <strong>${fmt(hrs(r))} h</strong></p><div class="small muted">Reg.nr: <strong>${esc(r.reg)}</strong> · Traktamente: ${r.allow?'Ja':'Nej'}</div>`:''}${r.note?`<p class="small muted">${esc(r.note)}</p>`:''}${editable?`<div style="margin-top:12px">${locked(r)?'<span class="tag bad">🔒 Låst för lön – kontakta chefen</span>':button('✏️ Ändra rapport','edit('+r.id+')','outline')}</div>`:''}</div>`}
function adminContent(){
if(state.tab==='overview'){
const rs=state.records.filter(r=>r.date.startsWith(state.month));return box(`<h2 class="h2">Månadens översikt</h2><div class="grid"><div class="tile"><div class="muted small">Rapporterade timmar</div><div class="big">${fmt(rs.reduce((a,r)=>a+hrs(r),0))} h</div></div><div class="tile"><div class="muted small">Traktamenten</div><div class="big">${rs.filter(r=>r.allow).length} st</div></div></div><h3>Chaufförer</h3>${state.people.map(p=>{const rows=rs.filter(r=>r.user===p.id);return `<button class="tile wide" style="width:100%;margin:5px 0" onclick="actions.personMonth('${p.id}')"><div class="row"><strong>${esc(p.name)}</strong><span class="tag">${rows.length} dagar</span></div><div class="muted small">${fmt(rows.reduce((a,r)=>a+hrs(r),0))} h · ${rows.filter(r=>r.allow).length} traktamenten · Visa dag för dag →</div></button>`}).join('')}<div class="notice">Inga rapporter behöver godkännas dag för dag. Rapportering visas direkt efter att chauffören sparat.</div>`)}
if(state.tab==='daily'){
const rs=state.records.filter(r=>r.date===state.dayView&&(state.filter==='all'||r.user===state.filter));const pending=state.people.filter(p=>(state.filter==='all'||p.id===state.filter)&&!rs.some(r=>r.user===p.id));const weekday=new Date(state.dayView+'T12:00:00').getDay();const missing=weekday!==0&&weekday!==6&&state.dayView<today;
return box(`<h2 class="h2">📅 Dagsöversikt</h2><div class="two"><div class="field"><label>Datum</label><input class="input" type="date" value="${state.dayView}" onchange="actions.day(this.value)"></div><div class="field"><label>Chaufför</label>${personSelect()}</div></div><div class="grid" style="margin-top:14px"><div class="tile"><div class="muted small">Rapporterat</div><div class="big">${rs.length} av ${state.filter==='all'?state.people.length:1}</div></div><div class="tile"><div class="muted small">Arbetstid</div><div class="big">${fmt(rs.reduce((a,r)=>a+hrs(r),0))} h</div></div></div><h3>${esc(dateFmt(state.dayView))}</h3>${rs.map(r=>`<div class="record"><div class="row"><strong>${esc(driverName(r.user))}</strong><span class="tag ok">Rapporterad</span></div>${record(r)}${button('Korrigera rapport','correct('+r.id+')','outline')}</div>`).join('')}${pending.map(p=>`<div class="record row"><strong>${esc(p.name)}</strong><span class="tag ${missing?'bad':''}">${missing?'⚠️ Saknad rapport':'Ingen rapport ännu'}</span></div>`).join('')}<p class="small muted">Vardagar kan markeras saknade i efterhand. Helger flaggas inte automatiskt; de rapporteras vid behov.</p>`)}
if(state.tab==='reports'){
const rs=state.records.filter(r=>(state.filter==='all'||r.user===state.filter)&&r.date.startsWith(state.month)).slice().sort((a,b)=>b.date.localeCompare(a.date));return box(`<h2 class="h2">Månadsrapporter · dag för dag</h2>${filterForm()}<div class="grid"><div class="tile"><div class="muted small">Timmar</div><div class="big">${fmt(rs.reduce((a,r)=>a+hrs(r),0))} h</div></div><div class="tile"><div class="muted small">Traktamenten</div><div class="big">${rs.filter(r=>r.allow).length}</div></div></div>${rs.map(r=>`<div class="record"><div class="row"><strong>${esc(driverName(r.user))}</strong><span class="tag ok">Rapporterad</span></div>${record(r)}${button('✏️ Korrigera','correct('+r.id+')','outline')}</div>`).join('')||'<p class="muted">Inga rapporter denna månad.</p>'}<div class="notice">Ändringar loggas. När chefen rättar en rapport ska chauffören få besked om ändringen och orsaken.</div>`)}
if(state.tab==='payroll'){
const rs=state.records.filter(r=>(state.filter==='all'||r.user===state.filter)&&r.date.startsWith(state.month));const persons=state.people.filter(p=>state.filter==='all'||p.id===state.filter);return box(`<h2 class="h2">Löneunderlag</h2>${filterForm()}<div class="grid"><div class="tile"><div class="muted small">Timmar</div><div class="big">${fmt(rs.reduce((a,r)=>a+hrs(r),0))} h</div></div><div class="tile"><div class="muted small">Traktamenten</div><div class="big">${rs.filter(r=>r.allow).length} st</div></div></div><br>${button('⬇️ Exportera CSV – utan att låsa','export()','wide')}<div class="divider"></div><h3>Fastställ och lås perioden</h3><p class="muted small">Chefen kan titta och exportera hur många gånger som helst. Först vid fastställning låses chaufförens egna ändringar.</p>${persons.map(p=>{const k=p.id+'|'+state.month;return `<div class="record row wrap"><div><strong>${esc(p.name)}</strong><div class="small muted">${state.periodLocks[k]?'🔒 Fastställd':'🔓 Öppen för ändringar'}</div></div>${button(state.periodLocks[k]?'Lås upp (demo)':'Fastställ & lås','toggleLock(\''+p.id+'\')',state.periodLocks[k]?'alt':'')}</div>`}).join('')}<div class="notice warn">Detta är bara en simulering. I riktiga systemet ska upplåsning och efterhandsrättningar vara särskilt spårbara och inte skriva över ett fastställt löneunderlag.</div>`)}
if(state.tab==='people'){return box(`<h2 class="h2">Hantera chaufförer</h2><p class="muted small">Endast ordinarie chaufförer i nuläget. F-skattare hanterar sina egna timmar.</p>${state.people.map(p=>`<div class="record row"><div><strong>${esc(p.name)}</strong><div class="muted small">${esc(p.email)}</div></div><span class="tag ok">Aktiv</span></div>`).join('')}<h3>Lägg till chaufför</h3><div class="stack"><div class="field"><label>Namn</label><input class="input" id="newname" placeholder="Förnamn Efternamn"></div><div class="field"><label>E-post</label><input class="input" id="newemail" type="email" placeholder="namn@exempel.se"></div>${button('Skapa demokonto','newDriver()','wide')}<div class="notice">I riktiga appen skickas en personlig engångsinbjudan och chauffören skapar sitt eget lösenord. Avsändare på företagets domän behöver godkännas och ställas in.</div></div>`)}return ''}
function personSelect(){return `<select class="input" onchange="actions.filter(this.value)"><option value="all">Alla chaufförer</option>${state.people.map(p=>`<option value="${esc(p.id)}" ${state.filter===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`}
function filterForm(){return `<div class="two" style="margin-bottom:13px"><div class="field"><label>Chaufför</label><select class="input" onchange="actions.filter(this.value)"><option value="all">Alla chaufförer</option>${state.people.map(p=>`<option value="${esc(p.id)}" ${state.filter===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Månad</label><input class="input" type="month" value="${state.month}" onchange="actions.month(this.value)"></div></div>`}const actions={go,role:r=>{state.role=r;state.extended=false;render()},login:()=>{if(state.role==='boss'){state.tab='overview';go('admin')}else go('home')},logout:()=>{state.extended=false;go('login')},reset:()=>{if(!$('resetmail').value.includes('@')){alert('Skriv en mejladress först.');return}go('resetDone')},field:(k,v)=>{state[k]=v;if(k==='start'||k==='end'||k==='break'){const w=$('worked');if(w)w.textContent=fmt(estimate())+' timmar'}},type:t=>{state.type=t;const w=$('workfields'),a=$('awayinfo');if(w)w.style.display=t==='work'?'':'none';if(a)a.style.display=t==='work'?'none':''},reg:el=>{el.value=el.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,3);state.reg=el.value},save:()=>{if(!/^\d{4}-\d\d-\d\d$/.test(state.date)){alert('Välj ett giltigt datum.');return}if(state.type==='work'&&!/^[A-Z]{3}$/.test(state.reg)){alert('Ange exakt tre bokstäver för registreringsnumret.');return}if(state.type==='work'&&estimate()<=0){alert('Kontrollera arbetstider och rast.');return}const old=state.editId?state.records.find(r=>r.id===state.editId):state.records.find(r=>r.user==='mig'&&r.date===state.date);if(old&&locked(old)){alert('Den här perioden är fastställd. Kontakta chefen för en rättning.');return}const collision=state.records.find(r=>r.user==='mig'&&r.date===state.date&&r.id!==state.editId);if(collision&&locked(collision)){alert('Den valda dagen är låst.');return}const item={id:state.editId||Date.now(),user:'mig',date:state.date,type:state.type};if(state.type==='work')Object.assign(item,{reg:state.reg,start:state.start,end:state.end,break:Number(state.break),allow:state.allow,note:state.note});if(old)logChange(item,JSON.parse(JSON.stringify(old)),'Chauffören');state.records=state.records.filter(r=>r.id!==item.id&&!(r.user==='mig'&&r.date===item.date));state.records.push(item);state.editId=null;persist();go('saved')},edit:id=>{const r=state.records.find(r=>r.id===id&&r.user==='mig');if(!r)return;if(locked(r)){alert('Perioden är låst. Kontakta chefen.');return}Object.assign(state,{editId:r.id,date:r.date,type:r.type,start:r.start||'05:00',end:r.end||'16:30',break:r.break??30,reg:r.reg||'',allow:!!r.allow,note:r.note||''});go('report')},cancelEdit:()=>{state.editId=null;go('history')},day:v=>{state.dayView=v;render()},personMonth:id=>{state.filter=id;state.tab='reports';render()},toggleLock:id=>{const k=id+'|'+state.month;state.periodLocks[k]=!state.periodLocks[k];state.audit.unshift({date:new Date().toLocaleString('sv-SE'),actor:'Chefen',event:(state.periodLocks[k]?'Låste':'Låste upp')+' löneperiod '+k});render()},month:v=>{state.month=v;render()},tab:v=>{state.tab=v;render()},filter:v=>{state.filter=v;render()},unlock:()=>{if(!$('secondpass').value.trim()){alert('Skriv något i verifieringsfältet för att testa.');return}state.extended=true;state.logs.unshift('Utökad åtkomst aktiverad · demo');state.tab='overview';go('admin')},lock:()=>{state.extended=false;state.logs.unshift('Utökad åtkomst avslutad · demo');go('home')},correct:id=>{const r=state.records.find(x=>x.id===id);if(!r)return;const old=JSON.parse(JSON.stringify(r));const fields=r.type==='work'?[['start','Starttid'],['end','Sluttid'],['break','Rast (minuter)'],['reg','Reg.nr (tre bokstäver)'],['allow','Traktamente (ja/nej)'],['note','Kommentar']]:[['type','Dagstyp (work/free/sick/vab/vacation/other)']];const menu=fields.map((x,i)=>(i+1)+'. '+x[1]).join('\n');const chosen=prompt('Vilket fält vill du korrigera? Ange siffran:\n'+menu);if(chosen===null)return;const field=fields[Number(chosen)-1];if(!field){alert('Välj en giltig siffra.');return}const key=field[0];const val=prompt('Nytt värde för '+field[1]+':',String(r[key]??''));if(val===null)return;let next=val;if(key==='reg'){next=val.toUpperCase();if(!/^[A-Z]{3}$/.test(next)){alert('Exakt tre bokstäver krävs.');return}}if(key==='start'||key==='end'){if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(next)){alert('Ange HH:MM.');return}}if(key==='break'){next=Number(val);if(!Number.isFinite(next)||next<0||next>1440){alert('Ogiltig rast.');return}}if(key==='allow'){if(!['ja','nej'].includes(val.toLowerCase())){alert('Skriv ja eller nej.');return}next=val.toLowerCase()==='ja'}if(key==='type'&&!Object.hasOwn(labels,val)){alert('Ogiltig dagstyp.');return}if(String(r[key]??'')===String(next))return;const reason=prompt('Ange anledning till rättningen (visas för chauffören):');if(!reason?.trim()){alert('Anledning krävs.');return}r[key]=next;logChange(r,old,'Chefen · '+reason.trim());persist();alert('Demorättning sparad. I riktiga appen meddelas chauffören automatiskt.');render()},newDriver:()=>{let n=$('newname').value.trim(),e=$('newemail').value.trim();if(!n||!e.includes('@')){alert('Ange namn och giltig mejladress.');return}state.people.push({id:'demo'+Date.now(),name:n,email:e});persist();alert('Demokonto skapat. Ingen inbjudan har skickats.');render()},export:()=>{const rs=state.records.filter(r=>(state.filter==='all'||r.user===state.filter)&&r.date.startsWith(state.month));const csv=[['Chaufför','Datum','Typ','Start','Slut','Rast min','Reg.nr','Timmar','Traktamente','Kommentar'],...rs.map(r=>[state.people.find(p=>p.id===r.user)?.name||r.user,r.date,labels[r.type],r.start||'',r.end||'',r.break||'',r.reg||'',fmt(hrs(r)),r.allow?'Ja':'Nej',r.note||''])].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sixten_tidrapport_demo.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}};window.actions=actions;render();
</script></body></html>
