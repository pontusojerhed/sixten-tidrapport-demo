<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sixten Tidrapport 2.3 – originaldesign med nya funktioner</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#182b43;background:#eef3f8}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.shell{max-width:1020px;margin:auto;padding:20px 14px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:11px;font-weight:850;letter-spacing:.07em}.logo{background:#15263e;color:#80d6ff;border-radius:14px;padding:13px;font-size:24px}.sub{font-size:11px;color:#6a7c90;letter-spacing:.14em}.pill{border:1px solid #d6e1ec;border-radius:30px;padding:6px 10px;color:#61758b;font-size:12px;background:white}.panel{background:#fff;border:1px solid #dbe5ee;border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 5px 24px #18334d08}.hero{background:#15263e;color:white;border:0}.hero .muted{color:#bfd1e5}.muted{color:#718198}.small{font-size:13px}.tiny{font-size:11px}.big{font-size:34px;font-weight:800;letter-spacing:-.04em}.heading{font-size:23px;font-weight:800;margin:0 0 8px}.h2{font-size:17px;font-weight:800;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{padding:17px;border:1px solid #dce6ef;border-radius:16px;background:#f7fafd;text-align:left;color:#182b43}.tile:hover{border-color:#63b9eb}.tile strong{display:block;margin:9px 0 5px}.btn{border:0;background:#2466a4;color:white;border-radius:12px;padding:12px 16px;font-weight:700}.btn:hover{filter:brightness(1.07)}.btn.alt{background:#edf3f8;color:#234463}.btn.outline{border:1px solid #c9d9e8;background:white;color:#234463}.btn.danger{background:#fff0f0;color:#a13232}.btn.wide{width:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.wrap{flex-wrap:wrap}.stack{display:grid;gap:12px}.field{display:grid;gap:6px}.field label{font-size:13px;font-weight:750}.input{width:100%;border:1px solid #cedce8;border-radius:11px;padding:11px;background:white;color:#182b43;min-width:0}.input:focus{outline:2px solid #9bd8ff}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}.tabs button{border:1px solid #d4e1ec;border-radius:10px;padding:9px 12px;background:white;color:#39556f}.tabs button.active{background:#15263e;color:white;border-color:#15263e}.radio{display:flex;gap:9px;align-items:center;padding:11px 12px;border:1px solid #dce6ef;border-radius:12px;background:#f8fbfd;cursor:pointer}.radio input{accent-color:#2466a4}.notice{padding:13px;border-radius:12px;background:#edf7ff;color:#315777;font-size:13px}.warn{background:#fff6e6;color:#805a19}.good{background:#ebf9f0;color:#246a42}.record{border:1px solid #dce6ef;border-radius:14px;padding:13px;margin:9px 0}.tag{font-size:11px;padding:5px 9px;border-radius:20px;background:#eaf0f7;color:#51687e;white-space:nowrap}.tag.ok{background:#e5f8eb;color:#247044}.tag.bad{background:#fff1d8;color:#805a19}.divider{border-top:1px solid #e1e9f0;margin:14px 0}.hide{display:none!important}.right{text-align:right}.back{border:0;background:transparent;color:#2466a4;font-weight:750;padding:4px 0 14px}.footer{color:#77889a;font-size:12px;text-align:center;margin-top:20px}.status{display:flex;align-items:center;gap:9px;padding:12px 0;border-bottom:1px solid #e4ebf1}.status:last-child{border:0}.dot{height:9px;width:9px;border-radius:50%;background:#5a9c77}.dangerText{color:#b34a4a}.num{font-variant-numeric:tabular-nums}.rolebar{display:flex;flex-wrap:wrap;gap:8px}.rolebar button{border:1px solid #d3e0ec;border-radius:12px;padding:10px 13px;background:#fff;color:#244765}.rolebar button.active{background:#15263e;color:#fff}.checkbox{display:flex;gap:12px;align-items:center;padding:13px;border:1px solid #dbe6ef;border-radius:12px}.checkbox input{width:19px;height:19px;accent-color:#2466a4}.locked{border:1px dashed #b7ccdd;border-radius:14px;padding:15px;background:#f6faff}.auth{max-width:470px;margin:20px auto}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:620px){.grid3{grid-template-columns:1fr}.two{grid-template-columns:1fr}.shell{padding:14px 10px 60px}.panel{padding:16px}.heading{font-size:21px}.big{font-size:30px}}@media(max-width:370px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="shell"><div class="top"><div class="brand"><div class="logo">🚛</div><div>SIXTEN<div class="sub">TIDRAPPORT</div></div></div><span class="pill">VERSION 2.3 · KLICKBAR DEMO</span></div><div id="app"></div><div class="footer">Sixten Tidrapport · Prototyp för diskussion · Ingen riktig inloggning, e-post, databas eller Raspberry Pi-anslutning.</div></main><script>
'use strict';const today=new Date().toLocaleDateString('sv-SE',{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/^(\d{4})-(\d{2})-(\d{2})$/,'$1-$2-$3');const base=[{id:1,user:'mig',date:'2026-10-12',type:'work',start:'05:00',end:'16:00',break:30,reg:'ABC',allow:true,note:'Lossning Örebro',approved:false},{id:2,user:'mig',date:'2026-10-13',type:'sick',approved:false},{id:3,user:'anna',date:'2026-10-12',type:'work',start:'06:00',end:'15:30',break:30,reg:'DEF',allow:false,note:'',approved:false},{id:4,user:'erik',date:'2026-10-12',type:'work',start:'04:00',end:'16:00',break:45,reg:'GHI',allow:true,note:'',approved:false}];const users=[{id:'mig',name:'Du (chaufför)',email:'du@demo.se'},{id:'anna',name:'Chaufför Anna',email:'anna@demo.se'},{id:'erik',name:'Chaufför Erik',email:'erik@demo.se'}];const labels={work:'🚛 Arbetat',free:'🏡 Ledig',sick:'🤒 Sjuk',vab:'👶 VAB',vacation:'☀️ Semester',other:'📋 Annan frånvaro'};const state={role:'driver',page:'login',extended:false,tab:'overview',filter:'all',month:'2026-10',date:today,type:'work',reg:'',start:'05:00',end:'16:30',break:30,allow:false,note:'',authEmail:'',name:'',email:'',showPass:false,records:load(),people:loadPeople(),logs:[],request:false};function load(){try{return JSON.parse(localStorage.getItem('sixten_demo_records'))||base}catch{return base}}function loadPeople(){try{return JSON.parse(localStorage.getItem('sixten_demo_people'))||users}catch{return users}}function persist(){localStorage.setItem('sixten_demo_records',JSON.stringify(state.records));localStorage.setItem('sixten_demo_people',JSON.stringify(state.people))}const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const $=id=>document.getElementById(id);const hrs=r=>{if(r.type!=='work')return 0;const [h,m]=r.start.split(':').map(Number),[e,n]=r.end.split(':').map(Number);let v=e*60+n-h*60-m;if(v<0)v+=1440;return Math.max(0,v-Number(r.break||0))/60};const fmt=x=>x.toLocaleString('sv-SE',{maximumFractionDigits:2});const dateFmt=d=>new Date(d+'T12:00:00').toLocaleDateString('sv-SE',{day:'numeric',month:'long',year:'numeric'});const button=(label,action,cls='')=>`<button class="btn ${cls}" onclick="actions.${action}">${label}</button>`;const go=p=>{state.page=p;render()};const back=()=>`<button class="back" onclick="actions.go('home')">← Till startsidan</button>`;const box=(x,cls='')=>`<section class="panel ${cls}">${x}</section>`;const nav=()=>`<div class="tabs">${[['overview','Översikt'],['reports','Rapporter'],['payroll','Löneunderlag'],['people','Chaufförer']].map(([k,v])=>`<button class="${state.tab===k?'active':''}" onclick="actions.tab('${k}')">${v}</button>`).join('')}</div>`;function own(){const rs=state.records.filter(r=>r.user==='mig'&&r.date.startsWith(state.month));return {rs,h:rs.reduce((a,r)=>a+hrs(r),0),t:rs.filter(r=>r.allow).length}}function adminAllowed(){return state.role==='boss'||state.extended}function render(){let h='';if(state.page==='login'){h=box(`<div class="heading">Välkommen tillbaka 👋</div><p class="muted">Testa olika roller. Allt här är låtsasdata.</p><div class="field"><label>Demoinloggning</label><div class="rolebar">${[['driver','🚛 Chaufför + systemägare'],['boss','👔 Chef']].map(([k,v])=>`<button class="${state.role===k?'active':''}" onclick="actions.role('${k}')">${v}</button>`).join('')}</div></div><div class="stack" style="margin-top:16px"><div class="field"><label>E-post</label><input class="input" type="email" value="${state.role==='boss'?'mikael@carlssonifristad.se':'du@demo.se'}" readonly></div><div class="field"><label>Lösenord</label><input class="input" type="password" value="demolosen" readonly></div>${button('Logga in i demon →','login()','wide')}<button class="btn alt wide" onclick="actions.go('forgot')">Glömt lösenord?</button></div><p class="small muted">Här krävs inget riktigt lösenord. Chefen och chauffören ser olika vyer.</p>`,'auth')}
else if(state.page==='forgot'){h=box(`<button class="back" onclick="actions.go('login')">← Till inloggning</button><h2>Återställ lösenord</h2><p class="muted">Skriv din mejladress. I riktiga appen skickas en säker engångslänk.</p><div class="field"><label>E-post</label><input class="input" id="resetmail" type="email" placeholder="namn@exempel.se"></div><br>${button('Skicka återställningslänk','reset()','wide')}<p class="small muted">Demon skickar inga mejl.</p>`,'auth')}
else if(state.page==='resetDone'){h=box(`<div style="text-align:center;font-size:40px">✉️</div><h2 style="text-align:center">Kolla mejlen!</h2><p class="muted">Om adressen finns registrerad skickas en återställningslänk. I demon skickas inget.</p>${button('Till inloggningen','go(\'login\')','wide')}`,'auth')}
else{const header=`<div class="row wrap" style="margin-bottom:14px"><div><div class="muted small">Inloggad som</div><strong>${state.role==='boss'?'👔 Chef':state.extended?'🔐 Systemägare · utökad åtkomst':'🔧 Chaufför · systemägare'}</strong></div><button class="btn alt" onclick="actions.logout()">Logga ut</button></div>`;if(state.page==='home'){const o=own();h=header+box(`<div class="muted small">Mina timmar · ${state.month}</div><div class="big">${fmt(o.h)} timmar</div><div class="muted">${o.t} traktamenten · egna testuppgifter</div>`,'hero')+`<div class="grid" style="margin-bottom:14px">${[['report','📝','Rapportera dag','Arbete, ledigt eller frånvaro'],['history','📅','Mina timmar','Historik och summering'],['system','🛠️','System & säkerhet','Endast för systemägaren'],['help','🤖','Fråga Sixten','Enkel hjälp med appen']].filter(x=>state.role!=='boss'||!['system'].includes(x[0])).map(([p,i,n,d])=>`<button class="tile" onclick="actions.go('${p}')"><span style="font-size:24px">${i}</span><strong>${n}</strong><span class="small muted">${d}</span></button>`).join('')}</div>`+(adminAllowed()?box(`<h2 class="h2">Personaladministration</h2><p class="muted small">Rapporter och löneunderlag visas bara med chefens inloggning eller efter extra verifiering.</p>${button('Öppna chefspanelen','go(\'admin\')','wide')}`):box(`<div class="row"><strong>🔒 Personaluppgifter skyddade</strong><span class="tag">Låst</span></div><p class="muted small">Du ser inte andra chaufförers timmar eller löneunderlag i ditt vanliga läge.</p>${button('Begär utökad åtkomst','go(\'unlock\')','wide outline')}`));}
else if(state.page==='unlock'){h=header+box(`${back()}<h2 class="heading">🔐 Utökad åtkomst</h2><p>För att se andra chaufförers timmar och löneunderlag krävs en extra verifiering.</p><div class="notice warn">I den färdiga appen: nytt lösenord eller tvåfaktorsverifiering, tidsbegränsad session och en skyddad åtkomstlogg. Här simuleras det.</div><div class="field" style="margin-top:14px"><label>Extra verifiering (demo)</label><input class="input" type="password" placeholder="Skriv vad som helst" id="secondpass"></div><br>${button('Verifiera och lås upp','unlock()','wide')}<p class="small muted">Chefen ser inte automatiskt dina åtkomstloggar. En särskild rapport kan lämnas på begäran.</p>`)}
else if(state.page==='report'){h=header+box(`${back()}<h2 class="heading">Rapportera en dag</h2><div class="field"><label>Datum</label><input id="daydate" class="input" type="date" value="${esc(state.date)}" onchange="actions.field('date',this.value)"></div><div style="margin-top:14px" class="field"><label>Vad gäller för dagen?</label><div class="grid">${Object.entries(labels).map(([k,v])=>`<label class="radio"><input type="radio" name="daytype" ${state.type===k?'checked':''} onchange="actions.type('${k}')">${v}</label>`).join('')}</div></div><div id="workfields" class="stack" style="margin-top:15px;${state.type!=='work'?'display:none':''}"><div class="field"><label>Reg.nr – bara de tre första bokstäverna</label><input id="reg" class="input" style="max-width:110px;text-transform:uppercase;letter-spacing:3px;font-weight:800" maxlength="3" placeholder="ABC" value="${esc(state.reg)}" oninput="actions.reg(this)"><span class="muted tiny">Exempel: ABC. Inga siffror.</span></div><div class="two"><div class="field"><label>Starttid</label><input class="input" type="time" value="${state.start}" onchange="actions.field('start',this.value)"></div><div class="field"><label>Sluttid</label><input class="input" type="time" value="${state.end}" onchange="actions.field('end',this.value)"></div></div><div class="field"><label>Rast</label><select class="input" onchange="actions.field('break',this.value)">${[0,30,45,60].map(v=>`<option value="${v}" ${Number(state.break)===v?'selected':''}>${v} minuter</option>`).join('')}</select></div><label class="checkbox"><input type="checkbox" ${state.allow?'checked':''} onchange="actions.field('allow',this.checked)"><span><strong>Traktamente</strong><div class="muted small">Kryssa i om traktamente ska rapporteras</div></span></label><div class="field"><label>Kommentar (frivillig)</label><textarea class="input" rows="2" placeholder="Exempelvis lastning, lossning ..." oninput="actions.field('note',this.value)">${esc(state.note)}</textarea></div><div class="notice">Arbetad tid: <strong id="worked">${fmt(estimate())} timmar</strong></div></div><div class="notice" id="awayinfo" style="margin-top:15px;${state.type==='work'?'display:none':''}">Vid ledighet eller frånvaro behöver du inte fylla i tider, reg.nr eller traktamente.</div><br>${button('Spara dagens rapport','save()','wide')}<p class="muted small">Alla dagar kan rapporteras. Vardagar kan markeras som saknade först när rapporteringstiden gått ut. Helger flaggas inte automatiskt.</p>`)}
else if(state.page==='saved'){h=header+box(`<div style="text-align:center;font-size:46px">✅</div><h2 class="heading" style="text-align:center">Rapporten är sparad!</h2><p class="muted">Du hittar den i Mina timmar. Endast lokalt i den här demowebbläsaren.</p>${button('Visa mina timmar','go(\'history\')','wide')}<br><br>${button('Rapportera en dag till','go(\'report\')','wide alt')}`)}
else if(state.page==='history'){const o=own();h=header+box(`${back()}<h2 class="heading">Mina timmar</h2><div class="field"><label>Månad</label><input class="input" type="month" value="${state.month}" onchange="actions.month(this.value)"></div><div class="grid" style="margin-top:13px"><div class="tile"><div class="muted small">Arbetstid</div><div class="big">${fmt(o.h)} h</div></div><div class="tile"><div class="muted small">Traktamenten</div><div class="big">${o.t} st</div></div></div><h3>Rapporterade dagar</h3>${o.rs.length?o.rs.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(record).join(''):'<p class="muted">Inga rapporter för den här månaden.</p>'}`)}
else if(state.page==='admin'){if(!adminAllowed()){go('unlock');return}h=header+box(`${back()}<h2 class="heading">Chefens administration</h2><div class="notice">${state.role==='boss'?'Chefens vanliga behörighet':'Du använder tillfällig utökad åtkomst. Aktiviteten loggas i en skyddad systemlogg.'}</div>${state.extended?`<br>${button('Avsluta utökad åtkomst','lock()','outline')}`:''}`)+nav()+adminContent()}
else if(state.page==='system'){if(state.role==='boss'){go('home');return}h=header+box(`${back()}<h2 class="heading">System & säkerhet</h2><p class="muted">Din tekniska panel. Inga andra chaufförers tider visas här.</p>${[['🖥️','Raspberry Pi / webbserver','Övervakning och fellarm'],['🗄️','Databas','Kontroller och återställning'],['☁️','Google Drive-backup','Säkerhetskopior och återställning'],['🛡️','Säkerhetslogg','Utökad åtkomst och ändringar']].map(([i,n,d])=>`<div class="status"><span style="font-size:22px">${i}</span><div style="flex:1"><strong>${n}</strong><div class="muted small">${d}</div></div><span class="tag">Planerat</span></div>`).join('')}<div class="notice warn" style="margin-top:12px">Inga verkliga serverdata visas. Chefen får vid begäran en särskild loggrapport, inte direkt tillgång till loggarna.</div>${state.logs.length?`<h3>Demologg</h3>${state.logs.map(l=>`<p class="small">${esc(l)}</p>`).join('')}`:''}`)}
else if(state.page==='help'){h=header+box(`${back()}<h2 class="heading">🤖 Fråga Sixten</h2><p class="muted">I den färdiga appen kan Sixten hjälpa till med frågor om hur rapporteringen fungerar. Här finns färdiga demosvar.</p><div class="stack">${[['Jag glömde rapportera igår','Öppna Rapportera dag, välj gårdagens datum och fyll i uppgifterna. Om perioden är låst kontaktar du chefen.'],['Jag var sjuk – måste jag fylla i tider?','Nej. Välj Sjuk som dagstyp och spara. Då räknas dagen som aktivt rapporterad.'],['Jag körde i söndags','Välj söndagens datum och Arbetat. Söndagar är inte automatiskt lediga eller schemalagda.'],['Jag har glömt lösenordet','Tryck på Glömt lösenord? på inloggningssidan. Då kan du begära en säker återställningslänk.']].map(([q,a])=>`<details class="record"><summary style="cursor:pointer;font-weight:700">${q}</summary><p class="small">${a}</p></details>`).join('')}</div><div class="notice">Ingen AI är ansluten till demon och ingen chatt skickas till Sixten.</div>`)}
} $('app').innerHTML=h}function estimate(){const [a,b]=[state.start,state.end].map(v=>{let [h,m]=v.split(':').map(Number);return h*60+m});let d=b-a;if(d<0)d+=1440;return Math.max(0,(d-Number(state.break))/60)}function record(r){return `<div class="record"><div class="row"><strong>${esc(dateFmt(r.date))}</strong><span class="tag ${r.type==='work'?'ok':''}">${labels[r.type]||r.type}</span></div>${r.type==='work'?`<p class="small">${esc(r.start)}–${esc(r.end)} · Rast ${r.break} min · <strong>${fmt(hrs(r))} h</strong></p><div class="small muted">Reg.nr: <strong>${esc(r.reg)}</strong> · Traktamente: ${r.allow?'Ja':'Nej'}</div>`:''}${r.note?`<p class="small muted">${esc(r.note)}</p>`:''}</div>`}function adminContent(){if(state.tab==='overview'){let rs=state.records.filter(r=>r.date.startsWith(state.month)),h=rs.reduce((a,r)=>a+hrs(r),0),t=rs.filter(r=>r.allow).length;return box(`<h2 class="h2">Rapporteringsöversikt</h2><div class="grid"><div class="tile"><div class="muted small">Registrerade timmar</div><div class="big">${fmt(h)} h</div></div><div class="tile"><div class="muted small">Traktamenten</div><div class="big">${t}</div></div></div><h3>Chaufförer</h3>${state.people.map(p=>{const rows=rs.filter(r=>r.user===p.id);return `<div class="record"><div class="row"><strong>${esc(p.name)}</strong><span class="tag">${rows.length} rapporter</span></div><div class="muted small">${fmt(rows.reduce((a,r)=>a+hrs(r),0))} timmar · ${rows.filter(r=>r.allow).length} traktamenten</div></div>`}).join('')}<div class="notice warn">Saknad vardagsrapport kan markeras efter rapporteringstidens slut. Helger förväntas inte automatiskt, men arbete på helg kan alltid registreras. Schemaläggning och påminnelser är inte aktiva i demon.</div>`)}if(state.tab==='reports'){let rs=state.records.filter(r=>(state.filter==='all'||r.user===state.filter)&&r.date.startsWith(state.month)).slice().sort((a,b)=>b.date.localeCompare(a.date));return box(`<h2 class="h2">Granska tidrapporter</h2>${filterForm()}${rs.length?rs.map(r=>`<div class="record"><div class="row"><strong>${esc(state.people.find(p=>p.id===r.user)?.name||r.user)}</strong><span class="tag ${r.approved?'ok':''}">${r.approved?'Godkänd':'Ej godkänd'}</span></div>${record(r)}<div class="row wrap"><button class="btn alt" onclick="actions.approve(${r.id})">${r.approved?'Ångra godkännande':'Godkänn'}</button><button class="btn outline" onclick="actions.correct(${r.id})">Korrigera</button></div></div>`).join(''):'<p class="muted">Inga rapporter för valet.</p>'}<p class="small muted">I verkliga systemet sparas ursprungsvärde, ändring, vem som ändrat och när. Demon visar bara en förenklad rättning.</p>`)}if(state.tab==='payroll'){const rs=state.records.filter(r=>(state.filter==='all'||r.user===state.filter)&&r.date.startsWith(state.month));return box(`<h2 class="h2">Löneunderlag</h2>${filterForm()}<div class="grid"><div class="tile"><div class="muted small">Timmar</div><div class="big">${fmt(rs.reduce((a,r)=>a+hrs(r),0))} h</div></div><div class="tile"><div class="muted small">Traktamenten</div><div class="big">${rs.filter(r=>r.allow).length}</div></div></div><br><button class="btn wide" onclick="actions.export()">Ladda ner CSV-underlag</button><p class="small muted">Exporten innehåller endast demodata. Inga löner eller traktamentesbelopp räknas ut.</p>`)}if(state.tab==='people'){return box(`<h2 class="h2">Hantera chaufförer</h2><p class="muted small">Endast fast anställda i den här versionen. F-skattare hanterar sina egna tider.</p>${state.people.map(p=>`<div class="record row"><div><strong>${esc(p.name)}</strong><div class="muted small">${esc(p.email)}</div></div><span class="tag ok">Aktiv</span></div>`).join('')}<h3>Lägg till chaufför</h3><div class="stack"><div class="field"><label>Namn</label><input class="input" id="newname" placeholder="Förnamn Efternamn"></div><div class="field"><label>E-post</label><input class="input" id="newemail" type="email" placeholder="namn@exempel.se"></div>${button('Skapa demokonto','newDriver()','wide')}<div class="notice">I riktiga appen får chauffören en säker engångsinbjudan via mejl, och skapar sitt eget lösenord. Avsändare, t.ex. tidrapport@carlssonifristad.se, behöver godkännas och konfigureras först.</div></div>`)}return ''}function filterForm(){return `<div class="two" style="margin-bottom:13px"><div class="field"><label>Chaufför</label><select class="input" onchange="actions.filter(this.value)"><option value="all">Alla chaufförer</option>${state.people.map(p=>`<option value="${esc(p.id)}" ${state.filter===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Månad</label><input class="input" type="month" value="${state.month}" onchange="actions.month(this.value)"></div></div>`}const actions={go,role:r=>{state.role=r;state.extended=false;render()},login:()=>{if(state.role==='boss'){state.tab='overview';go('admin')}else go('home')},logout:()=>{state.extended=false;go('login')},reset:()=>{if(!$('resetmail').value.includes('@')){alert('Skriv en mejladress först.');return}go('resetDone')},field:(k,v)=>{state[k]=v;if(k==='start'||k==='end'||k==='break'){const w=$('worked');if(w)w.textContent=fmt(estimate())+' timmar'}},type:t=>{state.type=t;const w=$('workfields'),a=$('awayinfo');if(w)w.style.display=t==='work'?'':'none';if(a)a.style.display=t==='work'?'none':''},reg:el=>{el.value=el.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,3);state.reg=el.value},save:()=>{if(!/^\d{4}-\d\d-\d\d$/.test(state.date)){alert('Välj ett giltigt datum.');return}if(state.type==='work'&&!/^[A-Z]{3}$/.test(state.reg)){alert('Ange exakt tre bokstäver för registreringsnumret.');return}if(state.type==='work'&&estimate()<=0){alert('Kontrollera arbetstider och rast.');return}const item={id:Date.now(),user:'mig',date:state.date,type:state.type,approved:false};if(state.type==='work')Object.assign(item,{reg:state.reg,start:state.start,end:state.end,break:Number(state.break),allow:state.allow,note:state.note});state.records=state.records.filter(r=>!(r.user==='mig'&&r.date===state.date));state.records.push(item);persist();go('saved')},month:v=>{state.month=v;render()},tab:v=>{state.tab=v;render()},filter:v=>{state.filter=v;render()},unlock:()=>{if(!$('secondpass').value.trim()){alert('Skriv något i verifieringsfältet för att testa.');return}state.extended=true;state.logs.unshift('Utökad åtkomst aktiverad · demo');state.tab='overview';go('admin')},lock:()=>{state.extended=false;state.logs.unshift('Utökad åtkomst avslutad · demo');go('home')},approve:id=>{let r=state.records.find(x=>x.id===id);if(r){r.approved=!r.approved;persist();render()}},correct:id=>{const r=state.records.find(x=>x.id===id);if(!r)return;const newNote=prompt('Demo: ändra kommentaren för rapporten. I riktig app loggas varje ändring.',r.note||'');if(newNote!==null){r.note=newNote;persist();render()}},newDriver:()=>{let n=$('newname').value.trim(),e=$('newemail').value.trim();if(!n||!e.includes('@')){alert('Ange namn och giltig mejladress.');return}state.people.push({id:'demo'+Date.now(),name:n,email:e});persist();alert('Demokonto skapat. Ingen inbjudan har skickats.');render()},export:()=>{const rs=state.records.filter(r=>(state.filter==='all'||r.user===state.filter)&&r.date.startsWith(state.month));const csv=[['Chaufför','Datum','Typ','Start','Slut','Rast min','Reg.nr','Timmar','Traktamente','Kommentar'],...rs.map(r=>[state.people.find(p=>p.id===r.user)?.name||r.user,r.date,labels[r.type],r.start||'',r.end||'',r.break||'',r.reg||'',fmt(hrs(r)),r.allow?'Ja':'Nej',r.note||''])].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sixten_tidrapport_demo.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}};window.actions=actions;render();
</script><style>
@media(max-width:620px){.top .pill{font-size:9px;padding:5px 7px}.logo{padding:10px}.grid{gap:8px}.tile{padding:13px}.btn{min-height:44px}.panel{border-radius:17px}}
.inline-extra{margin-top:14px}.mini-actions{display:grid;gap:9px}.mini-actions .btn{text-align:left}.compactline{padding:9px 0;border-bottom:1px solid #e4ebf1}.compactline:last-child{border:0}.selectrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.selectrow label{flex:1;min-width:130px}.alert-count{display:inline-block;background:#fff0d7;color:#855a16;padding:4px 9px;border-radius:20px;font-size:12px;font-weight:700}
</style><script>
(function(){
const K='sixten_tidrapport_23_extra';const initial={trips:[],requests:[],messages:[{id:10,title:'Nya rutiner vid lastning',body:'Från måndag kontrollerar vi fraktsedeln före avfärd.',kind:'important',recipients:['mig','anna','erik'],answers:{anna:'read'},date:''},{id:11,title:'Afterwork på fredag',body:'Vi ses kl. 19.00! Svara så vi vet hur många som kommer.',kind:'invite',recipients:['mig','anna','erik'],answers:{erik:'yes'},date:''}],model:'week',agreement:'transport'};
let x;try{x=Object.assign(initial,JSON.parse(localStorage.getItem(K))||{})}catch{x=initial}
const saveX=()=>localStorage.setItem(K,JSON.stringify(x));const fmtDate=v=>v?dateFmt(v):'Datum saknas';const name=id=>state.people.find(p=>p.id===id)?.name||id;
const active=()=>x.trips.find(t=>!t.returnDate);
const open=page=>{state.page=page;render();window.scrollTo(0,0)};
const btn=(label,action,cls='')=>`<button class="btn ${cls}" onclick="extra.${action}">${label}</button>`;
const field=(label,id,type='text',value='')=>`<div class="field"><label for="${id}">${label}</label><input class="input" id="${id}" type="${type}" value="${esc(value)}"></div>`;
const pages={
 absence:()=>box(`${back()}<h2 class="heading">Meddela frånvaro</h2><p class="muted small">Välj datum och vad som gäller. Chefen får ett ärende att hantera.</p><div class="stack">${field('Datum','absDate','date',state.date)}<div class="field"><label>Vad gäller det?</label><select class="input" id="absType" onchange="extra.absType()"><option value="doctor">Läkarbesök – information</option><option value="dentist">Tandläkarbesök – information</option><option value="sick">Sjukfrånvaro – information</option><option value="leave">Ledighet – ansökan</option><option value="other">Övrig information</option></select></div><div class="two">${field('Från kl. (valfritt)','absFrom','time','09:00')}${field('Till kl. (valfritt)','absTo','time','11:00')}</div><div class="field"><label>Kommentar (valfritt)</label><textarea class="input" id="absNote" rows="2" placeholder="Inga medicinska detaljer behövs"></textarea></div><div class="notice" id="absHelp">Information: chefen bekräftar mottagandet, inte själva läkarbesöket.</div>${btn('Skicka till chefen','sendAbs()','wide')}</div><div class="divider"></div><h3 class="h2">Mina ärenden</h3>${requestRows(false)}`),
 inbox:()=>box(`${back()}<h2 class="heading">Meddelanden</h2><p class="muted small">Viktig information behöver bekräftas. Inbjudningar kan du svara på.</p>${x.messages.filter(m=>m.recipients.includes('mig')).slice().reverse().map(m=>`<div class="record"><div class="row wrap"><strong>${esc(m.title)}</strong><span class="tag ${m.answers.mig?'ok':'bad'}">${m.answers.mig?'Svarat':'Inväntar svar'}</span></div><p class="small">${esc(m.body)}</p>${m.date?`<p class="muted small">${fmtDate(m.date)}</p>`:''}${m.kind==='invite'?`<div class="selectrow">${btn('✓ Jag kommer',`answer(${m.id},'yes')`,'alt')}${btn('✕ Kan inte',`answer(${m.id},'no')`,'outline')}</div>`:m.kind==='important'?btn('✓ Jag har läst',`answer(${m.id},'read')`,'wide'):''}${m.answers.mig?`<p class="small muted">Mitt svar: ${m.answers.mig==='yes'?'Kommer':m.answers.mig==='no'?'Kan inte':'Bekräftat läst'}</p>`:''}</div>`).join('')||'<p>Inga meddelanden.</p>'}`),
 messages:()=>box(`${back()}<h2 class="heading">Skicka meddelande</h2><div class="stack"><div class="field"><label>Mottagare</label><select id="msgTo" class="input"><option value="all">Alla chaufförer</option>${state.people.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Typ</label><select id="msgKind" class="input" onchange="extra.msgKind()"><option value="important">Viktig information – läsbekräftelse</option><option value="invite">Inbjudan – kommer/kan inte</option><option value="normal">Vanlig information</option></select></div>${field('Rubrik','msgTitle','text','Nya rutiner')}<div class="field"><label>Meddelande</label><textarea id="msgBody" class="input" rows="3" placeholder="Skriv meddelandet..."></textarea></div>${field('Datum för möte eller aktivitet (valfritt)','msgDate','date','')}<label class="checkbox"><input type="checkbox" id="msgAck" checked><span>Kräv bekräftelse eller svar</span></label>${btn('Skicka meddelande','sendMsg()','wide')}</div><div class="divider"></div><h3 class="h2">Utskick och bekräftelser</h3>${x.messages.slice().reverse().map(m=>`<div class="record"><strong>${esc(m.title)}</strong><p class="small muted">${m.recipients.filter(id=>m.answers[id]).length} av ${m.recipients.length} har svarat</p>${m.recipients.map(id=>`<div class="compactline small">${esc(name(id))}: ${m.answers[id]==='read'?'Bekräftat läst':m.answers[id]==='yes'?'Kommer':m.answers[id]==='no'?'Kan inte':'Inväntar svar'}</div>`).join('')}</div>`).join('')}`),
 requests:()=>box(`${back()}<h2 class="heading">Frånvaro och ledighet</h2><p class="muted small">Läs och hantera chaufförernas ärenden. Avslag kräver motivering.</p>${requestRows(true)}`),
 settings:()=>box(`${back()}<h2 class="heading">Beräkningsregler</h2><p class="muted small">Företaget väljer modell en gång. Inga scheman används.</p><div class="field"><label>Avtal</label><select class="input" id="agreement"><option value="transport" ${x.agreement==='transport'?'selected':''}>Transportavtalet (demo)</option><option value="other" ${x.agreement==='other'?'selected':''}>Annan överenskommelse</option></select></div><br><div class="field"><label>Övertidsmodell</label><select class="input" id="otModel"><option value="week" ${x.model==='week'?'selected':''}>Efter 40 timmar per vecka</option><option value="day" ${x.model==='day'?'selected':''}>Efter 8 timmar per dag</option><option value="both" ${x.model==='both'?'selected':''}>Dag och vecka, utan dubbelräkning</option></select></div><br>${btn('Spara inställningar','saveSettings()','wide')}<p class="notice warn">Demoinställning. Avtalets fullständiga övertidsregler och traktamentebelopp är ännu inte implementerade eller verifierade.</p>`)
};
function requestRows(boss){const rs=x.requests.filter(r=>boss||r.driver==='mig').slice().reverse();return rs.map(r=>`<div class="record"><div class="row wrap"><strong>${esc(name(r.driver))} · ${fmtDate(r.date)}</strong><span class="tag ${r.status==='approved'?'ok':r.status==='declined'?'bad':''}">${r.status==='approved'?'Bekräftat/godkänt':r.status==='declined'?'Avslaget':'Väntar på svar'}</span></div><p class="small">${esc(r.type)}${r.from?' · '+esc(r.from)+'–'+esc(r.to):''}</p>${r.note?`<p class="small muted">${esc(r.note)}</p>`:''}${r.reason?`<p class="notice warn">Motivering: ${esc(r.reason)}</p>`:''}${boss&&r.status==='pending'?`<div class="selectrow">${btn(r.approval?'Godkänn':'Bekräfta mottaget',`resolve(${r.id},'approved')`,'alt')}${btn('Avslå',`resolve(${r.id},'declined')`,'outline')}</div>`:''}</div>`).join('')||'<p class="muted small">Inga ärenden ännu.</p>'}
const oldRender=render;
render=function(){if(pages[state.page]){const header=`<div class="row wrap" style="margin-bottom:14px"><strong>${state.role==='boss'?'👔 Chef':'🚛 Chaufför'}</strong>${btn('Till startsidan',"home()",'alt')}</div>`;$('app').innerHTML=header+pages[state.page]();return}oldRender();
if(state.page==='home'&&state.role==='driver'){const grid=document.querySelector('#app .grid');if(grid){grid.insertAdjacentHTML('afterend',`<div class="panel"><h2 class="h2">Meddelanden och frånvaro</h2><div class="mini-actions">${btn('✉️ Meddelanden'+(x.messages.some(m=>m.recipients.includes('mig')&&!m.answers.mig)?' · Nya!':''),'openInbox()','wide alt')}${btn('📅 Meddela frånvaro / sök ledigt','openAbs()','wide outline')}</div></div>`)}}
if(state.page==='report'){
const check=document.querySelector('#workfields .checkbox');if(check){check.outerHTML=`<div class="record"><label class="checkbox"><input id="tripCheckbox" type="checkbox" ${active()?'checked':''} ${active()?'disabled':''} onchange="extra.tripToggle(this.checked)"><span><strong>Traktamente</strong><div class="muted small">${active()?'Pågående resa – följer med automatiskt':'Starta traktamenteresa på valt datum'}</div></span></label><div id="tripDetails" style="margin-top:10px">${tripDetails()}</div></div>`}
const away=document.querySelector('#awayinfo');if(away){away.insertAdjacentHTML('afterend',`<div class="inline-extra">${btn('📅 Meddela chefen om frånvaro på detta datum','openAbs()','wide outline')}</div><div class="small muted" style="margin-top:10px">${x.requests.filter(r=>r.driver==='mig'&&r.date===state.date).map(r=>esc(r.type)+' · '+esc(r.status)).join(' · ')}</div>`)}
}
if(state.page==='admin'){const n=x.requests.filter(r=>r.status==='pending').length;const msg=x.messages.reduce((a,m)=>a+m.recipients.filter(id=>!m.answers[id]).length,0);const nav=document.querySelector('#app .tabs');if(nav){nav.insertAdjacentHTML('beforebegin',`<div class="panel"><h2 class="h2">Kommunikation</h2><p class="small muted">${n} obesvarade frånvaroärenden · ${msg} väntande meddelandebekräftelser</p><div class="mini-actions">${btn('✉️ Skicka företagsmeddelande','openMessages()','wide')}${btn('📅 Hantera frånvaro och ledighet','openRequests()','wide alt')}${btn('⚙️ Beräkningsregler','openSettings()','wide outline')}</div></div>`)}}
};
function tripDetails(){const t=active();return t?`<div class="notice good"><strong>Pågående traktamenteresa</strong><div class="small">Avresa: ${fmtDate(t.departDate)} kl. ${esc(t.departTime)}</div></div><div class="field" style="margin-top:10px"><label>Hemkomstdatum</label><input class="input" id="returnDate" type="date" value="${state.date}"></div><div class="field" style="margin-top:8px"><label>Hemkomsttid till stationsorten</label><input class="input" id="returnTime" type="time" value="17:00"></div><br>${btn('Avsluta traktamenteresa','finishTrip()','wide outline')}`:x.tripDraft?`<div class="field"><label>Avresetid från stationsorten</label><input class="input" id="departTime" type="time" value="${esc(x.tripDraft)}"></div><p class="small muted">Avresedatum blir rapportens datum. Resan sparas när du sparar tidrapporten.</p>`:''}
const oldSave=actions.save;
actions.save=()=>{if(state.type==='work'&&!active()&&x.tripDraft&&/^[A-Z]{3}$/.test(state.reg)&&estimate()>0){const time=$('departTime')?.value||x.tripDraft;x.trips.push({id:Date.now(),departDate:state.date,departTime:time,returnDate:null,returnTime:null});x.tripDraft=null;saveX()}state.allow=!!active();oldSave()};
window.extra={
home:()=>open(state.role==='boss'?'admin':'home'),openAbs:()=>open('absence'),openInbox:()=>open('inbox'),openMessages:()=>open('messages'),openRequests:()=>open('requests'),openSettings:()=>open('settings'),
tripToggle:checked=>{x.tripDraft=checked?'07:00':null;saveX();const d=$('tripDetails');if(d)d.innerHTML=tripDetails()},
finishTrip:()=>{const t=active();if(!t)return;const d=$('returnDate').value,tm=$('returnTime').value;if(!d||!tm||d<t.departDate||(d===t.departDate&&tm<t.departTime)){alert('Kontrollera datum och tid för hemkomsten.');return}t.returnDate=d;t.returnTime=tm;saveX();render()},
absType:()=>{$('absHelp').textContent=$('absType').value==='leave'?'Ledighetsansökan: chefen måste fatta beslut. Avslag kräver motivering.':'Frånvaroanmälan: chefen bekräftar mottagandet. Rätt till ledighet kan bero på avtal och omständigheter.'},
sendAbs:()=>{const d=$('absDate').value;if(!d){alert('Välj datum');return}const type=$('absType').value;const labels={doctor:'Läkarbesök',dentist:'Tandläkarbesök',sick:'Sjukfrånvaro',leave:'Ledighetsansökan',other:'Övrig information'};x.requests.push({id:Date.now(),driver:'mig',date:d,type:labels[type],from:$('absFrom').value,to:$('absTo').value,note:$('absNote').value,status:'pending',approval:type==='leave',reason:''});saveX();alert('Ärendet har lagts till i demon. Inget skickas på riktigt.');open('absence')},
answer:(id,value)=>{const m=x.messages.find(m=>m.id===id);if(m){m.answers.mig=value;saveX();render()}},
msgKind:()=>{$('msgAck').checked=$('msgKind').value!=='normal'},
sendMsg:()=>{const title=$('msgTitle').value.trim(),body=$('msgBody').value.trim();if(!title||!body){alert('Ange rubrik och meddelande.');return}const to=$('msgTo').value,kind=$('msgKind').value,ack=$('msgAck').checked;const recipients=to==='all'?state.people.map(p=>p.id):[to];x.messages.push({id:Date.now(),title,body,kind:ack?kind:'normal',recipients,answers:{},date:$('msgDate').value});saveX();alert('Utskicket är sparat i demon. Inga riktiga aviseringar skickas.');render()},
resolve:(id,status)=>{const r=x.requests.find(r=>r.id===id);if(!r)return;let reason='';if(status==='declined'){reason=prompt('Motivering till avslag (obligatorisk):','')||'';if(!reason.trim()){alert('Du måste ange en motivering.');return}}r.status=status;r.reason=reason;r.answeredAt=new Date().toISOString();saveX();render()},
saveSettings:()=>{x.agreement=$('agreement').value;x.model=$('otModel').value;saveX();alert('Demoinställningar sparade.')}
};
// Ensure date changes refresh the selected day's absence information without resetting other form values.
const oldField=actions.field;actions.field=(k,v)=>{oldField(k,v);if(k==='date'&&state.page==='report'){const note=document.querySelector('#awayinfo + .inline-extra + .small');if(note)note.textContent=x.requests.filter(r=>r.driver==='mig'&&r.date===v).map(r=>r.type+' · '+r.status).join(' · ')}};
render();
})();
</script></body></html>
